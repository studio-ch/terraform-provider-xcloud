name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  GOWORK: "off"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Verify and publish preview binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Verify
        run: make build lint test
      - name: Build archives and checksums
        run: python3 scripts/build_release.py "$GITHUB_REF_NAME"
      - name: Sign and verify checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.PASSPHRASE }}
        run: python3 scripts/sign_release.py "$GITHUB_REF_NAME"
      - name: Publish GitHub preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/"$GITHUB_REF_NAME"/* \
            --verify-tag --prerelease --title "Xcloud Terraform Provider $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
